<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      /* Palm screen colors */
      --palm-screen-light: #A5B5A5;
      --palm-screen-base: #8B9E8B;
      --palm-screen-dark: #7A8A7A;

      /* Text colors */
      --palm-text-dark: #2D3A2D;
      --palm-text-secondary: #5B6B5B;
      --palm-text-light: #E8EFE8;

      /* Borders */
      --palm-border: #6B7B6B;
      --palm-border-light: #8B9B8B;
      --palm-border-dark: #5B6B5B;

      /* Entity colors */
      --entity-task: #4A90E2;
      --entity-note: #F5A623;
      --entity-project: #7ED321;
      --entity-list: #BD10E0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 380px;
      min-height: 420px;
      font-family: 'Courier New', Monaco, Consolas, monospace;
      background: var(--palm-screen-base);
      color: var(--palm-text-dark);
      padding: 0;
    }

    .header {
      background: var(--palm-screen-dark);
      border-bottom: 2px solid var(--palm-border-dark);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      display: grid;
      grid-template-columns: repeat(2, 12px);
      gap: 2px;
    }

    .logo-square {
      width: 12px;
      height: 12px;
    }

    .logo-task { background: var(--entity-task); }
    .logo-note { background: var(--entity-note); }
    .logo-project { background: var(--entity-project); }
    .logo-list { background: var(--entity-list); }

    .title {
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--palm-text-dark);
    }

    .content {
      padding: 12px;
    }

    .status-bar {
      background: var(--palm-screen-light);
      border: 2px solid;
      border-top-color: var(--palm-border-dark);
      border-left-color: var(--palm-border-dark);
      border-bottom-color: var(--palm-border-light);
      border-right-color: var(--palm-border-light);
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      display: inline-block;
      margin-right: 6px;
      border: 1px solid var(--palm-border-dark);
    }

    .status-dot.connected { background: var(--entity-project); }
    .status-dot.disconnected { background: #CC4444; }
    .status-dot.processing { background: var(--entity-note); animation: blink 0.5s infinite; }

    @keyframes blink {
      50% { opacity: 0.3; }
    }

    .panel {
      background: var(--palm-screen-light);
      border: 2px solid;
      border-top-color: var(--palm-border-dark);
      border-left-color: var(--palm-border-dark);
      border-bottom-color: var(--palm-border-light);
      border-right-color: var(--palm-border-light);
      padding: 10px;
      margin-bottom: 12px;
    }

    .panel-label {
      font-size: 10px;
      color: var(--palm-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .page-title {
      font-size: 12px;
      color: var(--palm-text-dark);
      word-break: break-word;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .page-url {
      font-size: 10px;
      color: var(--palm-text-secondary);
      word-break: break-all;
    }

    .detected-type {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: var(--palm-screen-light);
      border: 2px solid;
      border-top-color: var(--palm-border-dark);
      border-left-color: var(--palm-border-dark);
      border-bottom-color: var(--palm-border-light);
      border-right-color: var(--palm-border-light);
      margin-bottom: 12px;
    }

    .type-icon {
      font-size: 24px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--palm-screen-base);
      border: 2px solid var(--palm-border);
    }

    .type-info {
      flex: 1;
    }

    .type-label {
      font-size: 10px;
      color: var(--palm-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .type-name {
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .type-name.youtube { color: var(--entity-task); }
    .type-name.research { color: var(--entity-note); }
    .type-name.link { color: var(--entity-list); }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--palm-text-secondary);
      margin-bottom: 6px;
    }

    .field select {
      width: 100%;
      background: var(--palm-screen-light);
      border: 2px solid;
      border-top-color: var(--palm-border-dark);
      border-left-color: var(--palm-border-dark);
      border-bottom-color: var(--palm-border-light);
      border-right-color: var(--palm-border-light);
      color: var(--palm-text-dark);
      padding: 8px;
      font-family: 'Courier New', Monaco, Consolas, monospace;
      font-size: 12px;
      text-transform: uppercase;
    }

    .field select:focus {
      outline: none;
      background: var(--palm-screen-base);
    }

    .preview {
      background: var(--palm-screen-light);
      border: 2px solid;
      border-top-color: var(--palm-border-dark);
      border-left-color: var(--palm-border-dark);
      border-bottom-color: var(--palm-border-light);
      border-right-color: var(--palm-border-light);
      padding: 10px;
      margin-bottom: 12px;
      max-height: 120px;
      overflow-y: auto;
    }

    .preview-label {
      font-size: 10px;
      color: var(--palm-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .preview-content {
      font-size: 11px;
      color: var(--palm-text-dark);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.4;
    }

    .field input[type="date"],
    .field input[type="datetime-local"] {
      width: 100%;
      background: var(--palm-screen-light);
      border: 2px solid;
      border-top-color: var(--palm-border-dark);
      border-left-color: var(--palm-border-dark);
      border-bottom-color: var(--palm-border-light);
      border-right-color: var(--palm-border-light);
      color: var(--palm-text-dark);
      padding: 8px;
      font-family: 'Courier New', Monaco, Consolas, monospace;
      font-size: 12px;
    }

    .field input[type="date"]:focus,
    .field input[type="datetime-local"]:focus {
      outline: none;
      background: var(--palm-screen-base);
    }

    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--palm-screen-light);
      border: 2px solid;
      border-top-color: var(--palm-border-dark);
      border-left-color: var(--palm-border-dark);
      border-bottom-color: var(--palm-border-light);
      border-right-color: var(--palm-border-light);
      margin-bottom: 10px;
    }

    .checkbox-field input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--entity-task);
    }

    .checkbox-label {
      font-size: 12px;
      font-weight: bold;
      color: var(--palm-text-dark);
      letter-spacing: 0.03em;
    }

    .task-fields {
      display: none;
      gap: 10px;
    }

    .task-fields .field {
      flex: 1;
    }

    .task-fields.visible {
      display: flex;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px 12px;
      border: 2px solid;
      background: var(--palm-screen-base);
      font-family: 'Courier New', Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.1s;
    }

    .btn-primary {
      border-top-color: var(--palm-border-light);
      border-left-color: var(--palm-border-light);
      border-bottom-color: var(--palm-border-dark);
      border-right-color: var(--palm-border-dark);
      color: var(--palm-text-dark);
    }

    .btn-primary:hover {
      background: var(--palm-screen-dark);
    }

    .btn-primary:active {
      border-top-color: var(--palm-border-dark);
      border-left-color: var(--palm-border-dark);
      border-bottom-color: var(--palm-border-light);
      border-right-color: var(--palm-border-light);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      border-top-color: var(--palm-border-light);
      border-left-color: var(--palm-border-light);
      border-bottom-color: var(--palm-border-dark);
      border-right-color: var(--palm-border-dark);
      color: var(--palm-text-secondary);
      background: var(--palm-screen-light);
    }

    .btn-secondary:hover {
      background: var(--palm-screen-base);
      color: var(--palm-text-dark);
    }

    .message {
      padding: 10px;
      margin-bottom: 12px;
      border: 2px solid;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .message.success {
      border-color: var(--entity-project);
      color: var(--palm-text-dark);
      background: rgba(126, 211, 33, 0.2);
    }

    .message.error {
      border-color: #CC4444;
      color: var(--palm-text-dark);
      background: rgba(204, 68, 68, 0.2);
    }

    .message.info {
      border-color: var(--entity-task);
      color: var(--palm-text-dark);
      background: rgba(74, 144, 226, 0.2);
    }

    .settings-link {
      text-align: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--palm-border);
    }

    .settings-link a {
      color: var(--palm-text-secondary);
      font-size: 10px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .settings-link a:hover {
      color: var(--palm-text-dark);
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      gap: 16px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--palm-border);
      border-top-color: var(--entity-task);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 11px;
      color: var(--palm-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    #configNeeded {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-square logo-task"></div>
      <div class="logo-square logo-note"></div>
      <div class="logo-square logo-project"></div>
      <div class="logo-square logo-list"></div>
    </div>
    <div class="title">IdeaListed</div>
  </div>

  <div class="content">
    <div class="status-bar">
      <span>
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Checking...</span>
      </span>
      <span id="serverUrl"></span>
    </div>

    <div id="mainContent">
      <div class="loading" id="loadingState">
        <div class="spinner"></div>
        <div class="loading-text">Analyzing page...</div>
      </div>

      <div id="captureForm" style="display: none;">
        <div class="panel">
          <div class="panel-label">Current Page</div>
          <div class="page-title" id="pageTitle"></div>
          <div class="page-url" id="pageUrl"></div>
        </div>

        <div class="detected-type" id="detectedType">
          <div class="type-icon" id="typeIcon">🔗</div>
          <div class="type-info">
            <div class="type-label">Detected Type</div>
            <div class="type-name" id="typeName">Link</div>
          </div>
        </div>

        <div class="field">
          <label for="noteType">Override Type</label>
          <select id="noteType">
            <option value="auto">Auto-detect</option>
            <option value="video">🎥 YouTube Video</option>
            <option value="research">🔬 Research/Article</option>
            <option value="link">🔗 Link/URL</option>
          </select>
        </div>

        <div class="preview">
          <div class="preview-label">Content Preview</div>
          <div class="preview-content" id="previewContent">Extracting...</div>
        </div>

        <div class="checkbox-field">
          <input type="checkbox" id="createTaskCheckbox" />
          <div class="checkbox-label">Create task to study this note</div>
        </div>

        <div class="task-fields" id="taskFields">
          <div class="field">
            <label for="dueDateInput">Due Date</label>
            <input type="date" id="dueDateInput" />
          </div>
          <div class="field">
            <label for="reminderInput">Reminder (Date & Time)</label>
            <input type="datetime-local" id="reminderInput" />
          </div>
        </div>

        <div id="messageArea"></div>

        <div class="actions">
          <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button class="btn btn-primary" id="captureBtn" disabled>Capture</button>
        </div>
      </div>

      <div id="configNeeded" style="display: none;">
        <div class="message info">
          Configure server URL in extension settings.
        </div>
        <div class="actions" style="margin-top: 12px;">
          <button class="btn btn-primary" id="openOptionsBtn">Open Settings</button>
        </div>
      </div>
    </div>

    <div class="settings-link">
      <a href="#" id="settingsLink">⚙ Settings</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
